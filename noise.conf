# noise-machine configuration -- installed to /etc/noise-machine.conf
#
# Edit, then: sudo systemctl restart noise-machine
# Check what the program actually resolved: noise --config /etc/noise-machine.conf --print-config
#
# Every value here is verifiable on a development machine without a Pi:
#   make
#   ./bin/noise --f32 --seconds 600 --seed 1 --out - | ./bin/analyze - --band 200 8000

# ---------------------------------------------------------------------- tone

# Spectral slope in dB per octave. -6 is brown, -3 is pink, 0 is white.
# The filter self-calibrates to hit this within ~0.02 dB/oct anywhere in
# -7.5 .. 0. Below about -8 a first-order cascade runs out of range and the
# realized slope falls short -- -9 lands near -8.87.
slope_db_oct = -6.0

# The band over which that slope holds. Outside it the spectrum flattens, which
# is what keeps the generator mathematically bounded: there is no unbounded
# integrator anywhere in the chain, so it cannot drift or rail no matter how
# long it runs. Leave these alone unless you know why you are changing them.
slope_lo_hz = 8.0
slope_hi_hz = 20000.0

# 12 dB/octave highpass. Removes rumble a small driver cannot reproduce and
# which would otherwise consume headroom and amplifier current for nothing.
# Raise toward 40-60 Hz for a thinner, less "rumbly" character.
highpass_hz = 25.0

# 12 dB/octave lowpass, 0 disables. Brown noise is already dark; set this to
# 3000-8000 for a more muffled, distant character.
lowpass_hz = 0

# --------------------------------------------------------------------- level

# Target RMS in dBFS. The output gain is measured and set at startup, so this
# holds regardless of the tone settings above.
#
# -17.0 is the hard ceiling for clip-free output and the program WARNS at
# startup above it. Do not trust a short render to tell you otherwise: brown
# noise is Gaussian-ish, so its peak is unbounded and grows with run length --
# about 16.2 dB above RMS over eight hours. -16 measures perfectly clean for
# five minutes and then clips overnight; -12 clips within the first minute.
# -18 was measured at a -2.59 dBFS peak over a real 8-hour run.
#
# This is what the previous build got catastrophically wrong: it normalized to
# 0 dBFS and then met an ALSA mixer whose ceiling is +4 dB, not 0 dB, so about
# 1 % of all samples hard-clipped -- roughly 450 every second, forever. That
# was the crackle.
#
# Real volume control is the potentiometer on the amplifier board; the ALSA
# mixer has another +4 dB if you genuinely need it. Reach for those before
# raising this.
level_dbfs = -18.0

# TPDF dither before the 16-bit quantize. Costs nothing and removes any
# correlation between quantization error and the signal.
dither = 1

# 1 = two independent noise streams, one per channel. Identical signal in both
# channels images as a point source between the speakers, which sounds
# artificial over hours; decorrelated noise sounds diffuse, more like rain.
# 0 = identical mono to both channels.
independent = 1

# ------------------------------------------------------------------- hardware

# ALSA device, addressed by card NAME. Never use an index: `hw:0,0` is not
# stable across kernel updates or reflashes, and on a Pi with the KMS stack the
# HDMI card can enumerate first.
#   built-in 3.5 mm jack : hw:CARD=Headphones,DEV=0
#   list the options     : aplay -l
device = hw:CARD=Headphones,DEV=0

# 48000 sidesteps one resampling ratio: the Pi's firmware reclocks everything
# to 48828 Hz through a 512-tap FIR regardless of what you ask for.
rate = 48000

# ALSA ring geometry. bcm2835 caps BUFFER_BYTES at 131072, which is 32768
# frames at 16-bit stereo -- 683 ms at 48 kHz. That buffer depth is the entire
# defence against scheduling jitter, and latency is irrelevant for noise, so
# take all of it. 8192 x 4 = 32768 frames, exactly at the ceiling.
period_frames = 8192
periods = 4

# 0 = seed from the clock at startup. Set a fixed value only for reproducible
# test renders.
seed = 0

# How often to log the late/recovered/clipped counters, in seconds. 3600 is
# right for an appliance; set it to 10 when testing (see README, "Confirming
# the underrun counter actually counts").
stats_sec = 3600
